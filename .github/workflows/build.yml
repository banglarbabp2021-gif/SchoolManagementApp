name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Prepare Code
        run: |
          mkdir temp_extracted
          unzip -q "*.zip" -d temp_extracted
          # যদি জিপের ভেতরে কোনো মূল ফোল্ডার থাকে তা বের করে আনা
          if [ $(find temp_extracted -maxdepth 1 -mindepth 1 -type d | wc -l) -eq 1 ]; then
            cp -r temp_extracted/*/* . 2>/dev/null || true
            cp -r temp_extracted/*/.* . 2>/dev/null || true
          else
            cp -r temp_extracted/* . 2>/dev/null || true
            cp -r temp_extracted/.* . 2>/dev/null || true
          fi
          rm -rf temp_extracted
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPortal-APK
          path: app/build/outputs/apk/debug/*.apk
